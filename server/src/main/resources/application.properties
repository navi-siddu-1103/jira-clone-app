# Spring Boot Application Properties
server.port=${PORT:5000}

# MongoDB Configuration (Supports MONGODB_URI environment variable on cloud/Render)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/jira_clone}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.jira=DEBUG

# File Upload — max 10MB per file, 20MB per request
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Upload directory (can be overridden via FILE_UPLOAD_DIR env var on Render)
file.upload.dir=${FILE_UPLOAD_DIR:uploads}
